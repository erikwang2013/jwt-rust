[package]
name = "jwt-rust"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "A framework-agnostic JWT plugin for plain Rust and axum, actix-web, rocket, poem, salvo, warp, bee-rust, e-cat: one core, a request guard or eight native adapters, pluggable blacklist storage (redis / database / file / memcached)."
license = "MIT"
readme = "README.md"
authors = ["erik <erik@erik.xyz>"]
homepage = "https://erik.xyz"
repository = "https://github.com/erikwang2013/jwt-rust"
keywords = ["jwt", "authentication", "axum", "actix-web", "bee-rust"]
categories = ["authentication", "web-programming"]
exclude = ["/.agents", "/.claude", "/.claude-flow", "/.codex", "/.swarm", "/ruvector.db", "/docs/superpowers", "/CLAUDE.md", "/AGENTS.md"]

[dependencies]
actix-web = { version = "4.15.0", optional = true }
axum = { version = "0.8.9", optional = true }
base64 = "0.22.1"
bee_router = { version = "1.2.3", optional = true }
getrandom = "0.4.3"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
log = "0.4.34"
memcache = { version = "0.21.0", optional = true }
poem = { version = "3.1.12", optional = true }
redis = { version = "1.7.1", optional = true }
regex = "1.13.1"
rocket = { version = "0.5.1", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
salvo = { version = "1.0.1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
toml = "1.1.6"
tonic = { version = "0.14.6", optional = true }
tower = { version = "0.5.3", optional = true }
warp = { version = "0.4.3", optional = true }

[features]
default = []
redis = ["dep:redis"]
database = ["dep:rusqlite"]
memcached = ["dep:memcache"]
axum = ["dep:axum", "dep:tower"]
actix = ["dep:actix-web"]
rocket = ["dep:rocket"]
poem = ["dep:poem"]
salvo = ["dep:salvo"]
warp = ["dep:warp"]
bee-rust = ["dep:bee_router", "dep:axum"]
ecat = ["dep:tower", "dep:axum"]
ecat-grpc = ["ecat", "dep:tonic"]

[dev-dependencies]
# bee_rust 测试的 Controller 实现需要该宏；bee_router 未 re-export async_trait（测试专用，不污染消费者）
async-trait = "0.1.92"
bee_cache = "1.2.3"
bee_session = "1.2.3"
bee_template = "1.2.3"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
# warp 的 `warp::test` 模块在 `test` feature 之后（连带 hyper server/client）：仅在测试构建中启用，
# 不污染下游库使用者的依赖图（同 tower 的 `util` 处理方式）
warp = { version = "0.4.3", features = ["test"] }

[lints.rust]
unsafe_code = "forbid"
